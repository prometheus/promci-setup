---
name: Setup environment
description: Setup Prometheus build environment.
inputs:
  enable_go:
    description: Whether to enable go specific features, such as caching.
    default: "true"
  cache_key_suffix:
    description: |
      Suffix appended to the Go cache key to scope the cache per build flavor.
      Jobs that compile with different flags, architectures or build tags
      (e.g. -race, GOARCH=386, --tags=dedupelabels) should pass distinct
      suffixes so each keeps its own warm build cache instead of sharing a
      single key where only one flavor stays warm.
    default: "default"
  enable_npm:
    description: Whether to enable npm specific features, such as caching.
    default: "false"
  enable_docker_multibuild:
    description: Whether to enable multibuild docker
    default: "false"
  memlimit_ratio:
    description: The ratio of memory reserved for Go
    default: "0.8"
  clean-runner-disk:
    description: Whether to enable try to free up disk space on the runner.
    default: "false"
runs:
  using: composite
  steps:
    - name: Aggressive cleanup
      shell: bash
      if: ${{ inputs.clean-runner-disk == 'true' }}
      run: |
        df -h
        # Remove Java (JDKs)
        sudo rm -rf /usr/lib/jvm

        # Remove .NET SDKs
        sudo rm -rf /usr/share/dotnet

        # Remove Swift toolchain
        sudo rm -rf /usr/share/swift

        # Remove Haskell (GHC)
        sudo rm -rf /usr/local/.ghcup

        # Remove Julia
        sudo rm -rf /usr/local/julia*

        # Remove Android SDKs
        sudo rm -rf /usr/local/lib/android

        # Remove Chromium (optional if not using for browser tests)
        sudo rm -rf /usr/local/share/chromium

        # Remove Microsoft/Edge and Google Chrome builds
        sudo rm -rf /opt/microsoft /opt/google

        # Remove Azure CLI
        sudo rm -rf /opt/az

        # Remove PowerShell
        sudo rm -rf /usr/local/share/powershell

        df -h
    # Resolve the actual cache paths from the toolchain rather than hardcoding
    # them. In the golang-builder container GOPATH=/go, so GOMODCACHE is
    # /go/pkg/mod, which does not match a hardcoded ~/go/pkg/mod.
    - name: Resolve Go cache paths
      id: go-cache-paths
      shell: bash
      if: ${{ inputs.enable_go == 'true' }}
      # Run outside the checkout so the repository go.mod is not in scope.
      run: |
        cd "${RUNNER_TEMP}"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ inputs.enable_go == 'true' }}
      with:
        path: |
          ${{ steps.go-cache-paths.outputs.build }}
          ${{ steps.go-cache-paths.outputs.mod }}
        key: ${{ runner.os }}-go-${{ inputs.cache_key_suffix }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ inputs.cache_key_suffix }}-
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ inputs.enable_npm == 'true' }}
      with:
        path: |
          ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('web/ui/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-
    - name: Set GOMEMLIMIT
      shell: bash
      run: |
        ratio=${{ inputs.memlimit_ratio }}
        cgroup=$(awk -F':' '{print $3}' /proc/self/cgroup)
        cgroup_mem_limit=$(< "/sys/fs/cgroup/${cgroup}/memory.max")
        if [[ "${cgroup_mem_limit}" != "max" ]] ; then
          echo "${cgroup_mem_limit}" | awk -v "ratio=${ratio}" '{printf "GOMEMLIMIT=%.0fKiB\n", $1 / 1024 * ratio}' >> "$GITHUB_ENV"
          exit 0
        fi
        awk -v "ratio=${ratio}" '$1 == "MemTotal:" {printf "GOMEMLIMIT=%.0fKiB\n", $2 * ratio}' /proc/meminfo >> "$GITHUB_ENV"
      if: ${{ inputs.enable_go == 'true' }}
    - run: echo "GOMEMLIMIT=${GOMEMLIMIT}"
      shell: bash
      if: ${{ inputs.enable_go == 'true' }}
    - run: make promu
      shell: bash
      if: ${{ inputs.enable_go == 'true' }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      if: ${{ inputs.enable_docker_multibuild == 'true' }}
    - name: Set up buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      if: ${{ inputs.enable_docker_multibuild == 'true' }}
